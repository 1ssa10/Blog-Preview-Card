<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Blog Preview card</title>
  </head>
  <body>
    <div class="card">
      <div class="container">
        <div class="img">
          <img src="assets/images/illustration-article.svg" alt="Blog image" />
        </div>
        <div class="contant">
          <div class="category">Learning</div>
          <div class="date">Published 21 Dec 2023</div>
          <h2 class="title">HTML & CSS foundations</h2>
          <div class="description">
            These languages are the backbone of every website, defining
            structure, content, and presentation.
          </div>
        </div>
        <div class="author">
          <div class="avatar">
            <img src="assets/images/image-avatar.webp" alt="Author avatar" />
          </div>
          Greg Hooper
        </div>
      </div>
    </div>
  </body>
</html>
